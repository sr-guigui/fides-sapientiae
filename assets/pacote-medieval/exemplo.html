<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Pacote Medieval — Exemplo</title>
<link rel="stylesheet" href="estilos-medievais.css">
<style>
 body{margin:0;font-family:Georgia,serif}
 section{padding:90px 8vw;text-align:center}
 h2{font-size:56px;margin:0 0 24px;letter-spacing:.02em}
 .row{display:flex;gap:40px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:30px}
 .dots{display:flex;gap:10px;align-items:center} .dots img{width:18px}
 .news{max-width:560px;margin:0 auto;text-align:left;color:#F4E9CF}
 .news div{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #f4e9cf88;font-size:22px}
 .video{width:560px;height:315px;background:linear-gradient(#7a9ad6,#2b3b2f);display:grid;place-items:center}
 .scroll{width:280px;height:400px;background:url(04-ornamentos/rolo-pergaminho.webp) center/contain no-repeat;display:grid;place-items:center;color:#14203A;padding:0 40px;box-sizing:border-box}
</style></head><body>
<section class="bg-damasco-azul granulado" style="color:#F2E9D8;padding-bottom:140px">
 <div class="faixa-titulo">✦ ROYAL EDITION ✦</div>
 <h2 style="margin-top:40px">A JORNADA DEFINITIVA</h2>
 <div class="row">
  <a class="btn-ingresso">OUT NOW</a>
  <a class="btn-contorno">PLATAFORMA</a>
  <span class="btn-etiqueta">PAID DLC</span>
 </div>
 <div class="row" style="margin-top:70px">
  <div class="moldura"><div class="video"><img src="05-elementos-svg/botao-play.svg" width="90"></div></div>
 </div>
</section>
<section class="bg-pergaminho rasgo-topo" style="color:#14203A"><div class="cantos-hera" style="padding:20px 0 40px">
 <h2>FORJE SEU CAMINHO</h2>
 <p style="font-size:20px;max-width:760px;margin:0 auto">Fundos, texturas e ornamentos inspirados em manuscritos medievais.</p>
 <div class="divisor-sol" style="max-width:1000px;margin:50px auto 0"></div>
 <div class="row">
  <img src="04-ornamentos/estrela-8-pontas-dourada.webp" width="70">
  <img src="04-ornamentos/cruz-flor-de-lis-dourada.webp" width="70">
  <div class="scroll">Prefeitura<br><br>Texto do pergaminho</div>
  <img src="04-ornamentos/sol-radiante-dourado.webp" width="160">
 </div>
</div></section>
<section class="bg-damasco-carmesim granulado rasgo-base">
 <h2 style="color:#F4E9CF">ÚLTIMAS NOTÍCIAS</h2>
 <div class="news">
  <div><span style="color:#F2C66D">Guia do cavaleiro</span><span class="selo-estrela">04</span></div>
  <div><span>Bastidores do filme</span><span class="selo-estrela">05</span></div>
 </div>
 <div class="row">
  <img src="05-elementos-svg/seta-esquerda.svg" width="90">
  <div class="dots"><img src="05-elementos-svg/losango-vazado.svg"><img src="05-elementos-svg/losango-cheio.svg"><img src="05-elementos-svg/losango-vazado.svg"><img src="05-elementos-svg/losango-vazado.svg"></div>
  <img src="05-elementos-svg/seta-direita.svg" width="90">
 </div>
</section>
<section class="bg-grunge rasgo-base" style="--rasgo:url(03-bordas-rasgadas/borda-rasgada-carmesim-base.webp);color:#F2E9D8">
 <h2>FUNDO GRUNGE ESCURO</h2>
 <div class="divisor" style="max-width:700px;margin:20px auto"><img src="05-elementos-svg/divisor-losango.svg" style="width:100%;height:24px"></div>
</section>
</body></html>
